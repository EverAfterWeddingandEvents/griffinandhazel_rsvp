<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Apps Script sets the title itself in doGet; this is what the hosted
       build and any crawler sees. build_site.py fills in the real values. -->
  <title>Wedding RSVP</title>
  <!--SOCIAL_META-->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<script>
  var CONFIG = <?!= configJson ?>;
</script>

  <?!= include('Gsap'); ?>
  <?!= include('Audio'); ?>

  <script>
    // Everything animated starts hidden — but only once we know the animation
    // engine is here to bring it back. No GSAP, or a guest who prefers not to
    // have things moving, means the page simply renders as-is.
    (function () {
      var reduce = window.matchMedia &&
                   window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (window.gsap && !reduce && CONFIG.animations !== false) {
        document.documentElement.className += ' anim';
      }
    })();
  </script>

  <?!= include('Assets'); ?>
  <?!= include('Stylesheet'); ?>
</head>

<body>

<div class="petals" id="petals" aria-hidden="true"></div>

<div class="page">

  <!-- ===================== HERO ===================== -->
  <header class="hero">
    <div class="hero__photo" id="heroPhoto" role="img"
         aria-label="Griffin and Hazel on the beach"></div>

    <div class="hero__inner">
      <div class="monogram" id="monogram" data-reveal>
        <svg class="monogram__ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="48"></circle>
        </svg>
        <span class="monogram__text" id="monogramText"></span>
      </div>

      <p class="eyebrow" id="invitationLine" data-reveal></p>

      <h1 class="hero__names script">
        <span class="hero__name" id="groomFirst" data-reveal></span>
        <span class="amp" data-reveal>&amp;</span>
        <span class="hero__name" id="brideFirst" data-reveal></span>
      </h1>

      <div class="rule" data-reveal><span class="rule__mark">&#10022;</span></div>

      <p class="hero__date" id="heroDate" data-reveal></p>

      <div class="countdown" id="countdown" data-reveal></div>

      <a class="scroll-cue" href="#rsvp" data-reveal
         aria-label="Go to the RSVP form">&#8964;</a>
    </div>
  </header>

  <!-- ===================== DETAILS ===================== -->
  <section class="section">
    <h2 class="section__title script" data-reveal>The Celebration</h2>
    <div class="rule" data-reveal><span class="rule__mark">&#10022;</span></div>

    <div class="details">
      <div class="cards">
        <div class="card" data-reveal>
          <div class="card__label" id="ceremonyTitle"></div>
          <div class="card__venue" id="ceremonyVenue"></div>
          <div class="card__meta" id="ceremonyMeta"></div>
        </div>

        <div class="card" data-reveal>
          <div class="card__label" id="receptionTitle"></div>
          <div class="card__venue" id="receptionVenue"></div>
          <div class="card__meta" id="receptionMeta"></div>
        </div>
      </div>

      <figure class="photo-frame" data-reveal>
        <div class="photo-frame__img" role="img"
             aria-label="Griffin and Hazel walking along the shore"></div>
        <figcaption class="photo-frame__caption" id="closingNote"></figcaption>
      </figure>
    </div>
  </section>

  <!-- ===================== RSVP ===================== -->
  <section class="section rsvp" id="rsvp">
    <div class="form-card" data-reveal>

      <!-- Form -->
      <div id="formPane">
        <div class="form-intro">
          <h2 class="section__title script">Kindly Reply</h2>
          <p id="requestLine"></p>
          <span class="deadline" id="deadline"></span>
        </div>

        <form id="rsvpForm" novalidate>

          <!-- Hidden from people, catnip for bots. Must stay empty. -->
          <div class="hp" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <div class="field" id="f-name">
            <label for="name">Full Name <span class="req">*</span></label>
            <input type="text" id="name" name="name" autocomplete="name"
                   placeholder="Juan Dela Cruz" maxlength="80" required>
            <p class="field__error" id="e-name"></p>
          </div>

          <div class="field" id="f-attending">
            <span class="fieldset__legend">Will you be joining us? <span class="req">*</span></span>
            <div class="choices" role="radiogroup" aria-label="Will you be joining us?">
              <label class="choice choice--yes">
                <input type="radio" name="attending" value="yes">
                <span class="choice__box">
                  <span class="choice__dot" aria-hidden="true"></span>
                  <span class="choice__text">
                    <strong>Yes, I'll be there</strong>
                    <span>Joyfully accepts</span>
                  </span>
                  <span class="choice__tick" aria-hidden="true">&#10003;</span>
                </span>
              </label>

              <label class="choice choice--no">
                <input type="radio" name="attending" value="no">
                <span class="choice__box">
                  <span class="choice__dot" aria-hidden="true"></span>
                  <span class="choice__text">
                    <strong>Sorry, I can't make it</strong>
                    <span>Regretfully declines</span>
                  </span>
                  <span class="choice__tick" aria-hidden="true">&#10003;</span>
                </span>
              </label>
            </div>
            <p class="field__error" id="e-attending"></p>
          </div>

          <div class="reveal" id="partyReveal">
            <div class="field" id="f-partySize">
              <label for="partySize">Number Attending <span class="req">*</span></label>
              <select id="partySize" name="partySize"></select>
              <span class="hint">Including yourself.</span>
              <p class="field__error" id="e-partySize"></p>
            </div>

            <div class="field" id="f-guestNames">
              <span class="fieldset__legend" id="guestNamesLabel">Names in Your Party</span>
              <div class="guests" id="guestNameList" role="group"
                   aria-labelledby="guestNamesLabel"></div>
              <span class="hint">So we can set your place cards correctly.</span>
            </div>
          </div>

          <div class="field" id="f-message">
            <label for="message">A Message for Griffin &amp; Hazel</label>
            <textarea id="message" name="message" maxlength="1000"
                      placeholder="Share a wish, a blessing, or a favourite memory..."></textarea>
            <span class="hint"><span id="msgCount">0</span> / 1000</span>
          </div>

          <button type="submit" class="btn" id="submitBtn">Send Our Reply</button>
          <div class="form-error" id="formError"></div>
        </form>
      </div>

      <!-- Thank you -->
      <div class="thanks" id="thanksPane">
        <div class="thanks__mark">&#10022;</div>
        <h2 class="thanks__title script" id="thanksTitle"></h2>
        <p class="thanks__body" id="thanksBody"></p>
        <button type="button" class="thanks__again" id="againBtn">Submit another reply</button>
      </div>

      <!-- RSVPs closed -->
      <div class="closed" id="closedPane" style="display:none">
        <h3 class="script">Our guest list has closed</h3>
        <p id="closedBody"></p>
      </div>

    </div>
  </section>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <div class="rule" data-reveal><span class="rule__mark">&#10022;</span></div>
    <div class="footer__names" id="footerNames" data-reveal></div>
    <div class="footer__meta" id="footerMeta" data-reveal></div>
  </footer>

</div>

<!-- ===================== MUSIC ===================== -->
<div class="music-dock" id="musicDock" hidden>
  <span class="music__hint" id="musicHint"></span>
  <button type="button" class="music" id="musicBtn"
          aria-pressed="false" aria-label="Play background music">
    <span class="music__note" aria-hidden="true">&#9834;</span>
    <span class="music__bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
</div>
<audio id="music" loop preload="none"></audio>

<?!= include('JavaScript'); ?>
</body>
</html>
