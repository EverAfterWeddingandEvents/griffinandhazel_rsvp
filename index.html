/* =============================================================================
   Griffin & Hazel — RSVP
   Palette lifted from the engagement photos: warm sand, sea haze, blush
   florals, sage leaves, cream linen.
   ========================================================================== */

:root {
  --cream:      #FBF7F1;
  --linen:      #F4EDE3;
  --sand:       #E7D8C3;
  --sand-deep:  #D6C2A8;
  --blush:      #E0AE9C;
  --blush-deep: #C98878;
  --peach:      #F2CDAE;
  --sage:       #9EAF95;
  --sage-deep:  #7C8F73;
  --sea:        #BFCFD2;
  --ink:        #4A3F36;
  --ink-soft:   #7A6C5D;
  --gold:       #C2A268;
  --white:      #FFFFFF;
  --shadow:     0 18px 50px -22px rgba(74, 63, 54, .45);
  --shadow-sm:  0 6px 20px -12px rgba(74, 63, 54, .5);
  --serif:      'Cormorant Garamond', 'Hoefler Text', Georgia, 'Times New Roman', serif;
  --sans:       'Jost', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

body::before {
  /* soft sand wash down the whole page */
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(1000px 500px at 15% -5%,  rgba(242, 205, 174, .30), transparent 60%),
    radial-gradient(900px 520px at 100% 12%, rgba(191, 207, 210, .30), transparent 60%),
    radial-gradient(800px 600px at 50% 105%, rgba(158, 175, 149, .22), transparent 62%);
  pointer-events: none;
  z-index: 0;
}

.page { position: relative; z-index: 1; }

/* ---- Animation gate --------------------------------------------------------
   The .anim class is only put on <html> when GSAP has loaded and the guest has
   not asked for reduced motion. Without it nothing is hidden, so a blocked
   script or an old browser degrades to a perfectly good static page. */

.anim [data-reveal] { opacity: 0; will-change: transform, opacity; }
.anim .hero__photo  { opacity: 0; }

/* ---- Drifting petals ------------------------------------------------------- */

.petals {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}
.petal {
  position: absolute;
  top: -8vh;
  border-radius: 60% 10% 60% 10%;
  opacity: 0;
  will-change: transform;
}

/* ---- Type ----------------------------------------------------------------- */

h1, h2, h3 { font-family: var(--serif); font-weight: 300; margin: 0; letter-spacing: .01em; }

.script {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 300;
}

.eyebrow {
  font-family: var(--sans);
  font-size: .70rem;
  letter-spacing: .38em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin: 0;
}

/* ---- Hero ----------------------------------------------------------------- */

.hero {
  position: relative;
  text-align: center;
  padding-bottom: 2rem;
}

/* The photograph gets its own band, so nothing is ever printed over their
   faces. It dissolves into the cream page at the bottom edge. */
.hero__photo {
  position: relative;
  width: min(100%, 1180px);
  margin: 0 auto;
  /* the photograph's own proportions, so nothing important is cropped away */
  aspect-ratio: 1318 / 880;
  max-height: 66vh;
  min-height: 260px;
  background-image: var(--img-hero);
  background-size: cover;
  background-position: 50% 12%;
}
.hero__photo::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg,
      rgba(251, 247, 241, .30) 0%,
      rgba(251, 247, 241, .00) 26%,
      rgba(251, 247, 241, .00) 55%,
      rgba(251, 247, 241, .55) 82%,
      var(--cream) 100%),
    radial-gradient(120% 80% at 50% 40%, transparent 45%, rgba(139, 122, 105, .18) 100%);
}

.hero__inner {
  position: relative;
  max-width: 720px;
  margin: -2.9rem auto 0;
  padding: 0 1.5rem;
}

/* Monogram medallion, straddling the edge of the photograph.
   The ring is an SVG rather than a border so it can draw itself on arrival. */
.monogram {
  position: relative;
  width: 5.4rem;
  height: 5.4rem;
  margin: 0 auto 1.5rem;
  border-radius: 50%;
  background: var(--cream);
  box-shadow: 0 0 0 6px var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
}

.monogram__ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.monogram__ring circle {
  fill: none;
  stroke: var(--sand-deep);
  stroke-width: 1.5;
  stroke-linecap: round;
  /* start the stroke at twelve o'clock instead of three */
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
}

/* 2πr for r=48, so the whole ring is one dash we can unroll. */
.anim .monogram__ring circle {
  stroke-dasharray: 301.6;
  stroke-dashoffset: 301.6;
}

.monogram__text {
  position: relative;
  font-family: var(--serif);
  font-size: 1.5rem;
  letter-spacing: .05em;
  color: var(--ink);
}
.monogram__ch { display: inline-block; }

/* The shimmer: a gold band inside an over-wide gradient that GSAP slides
   across the lettering every few seconds.

   The gradient sits on each glyph rather than on their container, because
   background-clip:text cannot paint through child elements — and the
   transparent fill it needs *does* inherit into them, so putting it on the
   parent leaves the letters simply invisible. Each glyph is given a shared
   coordinate space in JS so the band still reads as one sweep.

   The is-foil class is only added once support has been confirmed and the
   glyphs measured, so no JS or no support means plain ink letters. */
.monogram__text.is-foil .monogram__ch {
  background-image: linear-gradient(105deg,
    var(--ink) 0%,
    var(--ink) 42%,
    #D9BE84 47%,
    #F2E6C8 50%,
    #D9BE84 53%,
    var(--ink) 58%,
    var(--ink) 100%);
  /* Tiled, not no-repeat: the fill is transparent, so any part of a glyph the
     gradient fails to cover would be invisible rather than ink. Both ends of
     the gradient are the same ink colour and the tile is far wider than the
     monogram, so tiling reads as continuous ink with one travelling band. */
  background-repeat: repeat-x;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero__names {
  font-size: clamp(2.5rem, 8vw, 4.6rem);
  line-height: 1.06;
  color: var(--ink);
  margin: .9rem 0 .2rem;
}

.hero__names .amp {
  display: block;
  font-size: .40em;
  color: var(--blush-deep);
  margin: .1rem 0;
}

.hero__date {
  font-family: var(--sans);
  font-size: .78rem;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin: 1.2rem 0 0;
}

/* ornamental rule with a small diamond in the middle */
.rule {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .9rem;
  margin: 1.4rem auto;
  max-width: 320px;
  color: var(--sand-deep);
}
.rule::before, .rule::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--sand-deep), transparent);
}
.rule__mark { font-size: .6rem; color: var(--blush); letter-spacing: .3em; }

.countdown {
  margin-top: 1.6rem;
  font-family: var(--sans);
  font-size: .74rem;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.countdown strong {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.5rem;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  color: var(--blush-deep);
  display: block;
  margin-bottom: .1rem;
}

/* Days · Hours · Minutes · Seconds, ticking every second. */
.countdown__units {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 1.4rem;
}
/* A fixed width and lining figures keep the row from twitching sideways
   every time the seconds digit changes width. */
.countdown__unit {
  min-width: 3.1rem;
}
.countdown__unit strong {
  font-size: 2rem;
  margin-bottom: .3rem;
  font-variant-numeric: tabular-nums lining-nums;
  font-feature-settings: 'tnum' 1, 'lnum' 1;
}
.countdown__unit span {
  display: block;
  font-size: .58rem;
  letter-spacing: .2em;
}
.countdown__caption {
  margin-top: .95rem;
}

.scroll-cue {
  display: block;
  margin-top: 2rem;
  font-size: 1.3rem;
  line-height: 1;
  color: var(--sand-deep);
  text-decoration: none;
  animation: drift 2.6s ease-in-out infinite;
}
.scroll-cue:hover, .scroll-cue:focus-visible { color: var(--blush-deep); }
/* Hold still while it is being aimed at. */
.scroll-cue:hover, .scroll-cue:focus { animation-play-state: paused; }
@keyframes drift {
  0%, 100% { transform: translateY(0);   opacity: .55; }
  50%      { transform: translateY(7px); opacity: 1; }
}

/* ---- Sections ------------------------------------------------------------- */

.section {
  max-width: 1040px;
  margin: 0 auto;
  padding: 4.5rem 1.5rem;
}

.section__title {
  text-align: center;
  font-size: clamp(1.9rem, 5vw, 2.8rem);
  color: var(--ink);
}

/* ---- Details: two cards + photo ------------------------------------------- */

.details {
  display: grid;
  grid-template-columns: 1fr .78fr;
  gap: 3.2rem;
  align-items: center;
  max-width: 940px;
  margin: 0 auto;
}

.cards { display: grid; gap: 1.4rem; }

.card {
  background: rgba(255, 255, 255, .72);
  border: 1px solid rgba(214, 194, 168, .55);
  border-radius: 3px;
  padding: 2rem 1.9rem;
  box-shadow: var(--shadow-sm);
  position: relative;
}
.card::after {
  content: '';
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(214, 194, 168, .40);
  border-radius: 2px;
  pointer-events: none;
}

.card__label {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.45rem;
  color: var(--blush-deep);
  margin-bottom: .5rem;
}
.card__venue {
  font-family: var(--serif);
  font-size: 1.32rem;
  line-height: 1.35;
  color: var(--ink);
}
.card__meta {
  font-size: .74rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: .7rem;
}

.photo-frame {
  position: relative;
  padding: 12px;
  background: var(--white);
  box-shadow: var(--shadow);
  transform: rotate(-1.2deg);
}
.photo-frame__img {
  display: block;
  width: 100%;
  aspect-ratio: 61 / 90;
  background-image: var(--img-beach);
  background-size: cover;
  background-position: center;
}
.photo-frame__caption {
  font-family: var(--serif);
  font-style: italic;
  text-align: center;
  color: var(--ink-soft);
  font-size: 1rem;
  padding: .7rem .3rem .2rem;
}

/* ---- RSVP form ------------------------------------------------------------ */

.rsvp { background: linear-gradient(180deg, transparent, rgba(244, 237, 227, .75) 18%, rgba(244, 237, 227, .75) 82%, transparent); }

.form-card {
  max-width: 700px;
  margin: 0 auto;
  background: var(--white);
  border-radius: 4px;
  box-shadow: var(--shadow);
  padding: 3rem clamp(1.4rem, 5vw, 3.2rem) 2.6rem;
  border-top: 3px solid var(--blush);
}

.form-intro { text-align: center; margin-bottom: 2.4rem; }
.form-intro p { color: var(--ink-soft); margin: .5rem 0 0; }

.deadline {
  display: inline-block;
  margin-top: 1rem;
  padding: .45rem 1.1rem;
  border: 1px solid var(--sand-deep);
  border-radius: 999px;
  font-size: .7rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  background: var(--linen);
}

/* Honeypot — off-screen rather than display:none, which some bots detect */
.hp {
  position: absolute;
  left: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

.field { margin-bottom: 1.5rem; }

/* Direct children only. The attendance cards are labels too, and this rule
   would otherwise force them uppercase and override their colour coding. */
.field > label,
.fieldset__legend {
  display: block;
  font-size: .70rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: .55rem;
  font-weight: 500;
}
.req { color: var(--blush-deep); }
.hint {
  display: block;
  text-transform: none;
  letter-spacing: 0;
  font-size: .82rem;
  color: var(--ink-soft);
  opacity: .85;
  margin-top: .3rem;
}

input[type="text"],
input[type="email"],
input[type="tel"],
select,
textarea {
  width: 100%;
  font-family: var(--sans);
  font-size: 1rem;
  color: var(--ink);
  background: var(--cream);
  border: 1px solid var(--sand);
  border-radius: 2px;
  padding: .8rem .95rem;
  transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
textarea { resize: vertical; min-height: 108px; line-height: 1.6; }

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--blush);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(224, 174, 156, .22);
}

.field--error input,
.field--error select,
.field--error textarea { border-color: #C4705C; background: #FDF4F1; }

.field__error {
  display: none;
  color: #B3543F;
  font-size: .82rem;
  margin-top: .4rem;
}
.field--error .field__error { display: block; }

/* ---- Names in the party ----------------------------------------------------
   One row per extra seat, built by the script when the headcount changes. The
   ordinal sits above its box so long names still get the full column width. */

.guests { display: grid; gap: .7rem; }
.guest__label {
  display: block;
  font-size: .66rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  opacity: .8;
  margin-bottom: .3rem;
}

/* ---- Attendance choice -----------------------------------------------------
   Stacked radio cards. Each carries a real radio dot and a tick, because the
   earlier side-by-side panels gave no sign they were selectable — and once
   selected, looked almost identical to the one that was not. */

.choices { display: grid; gap: .85rem; }

.choice { position: relative; display: block; }

/* Hidden from view but still focusable, so arrow keys and screen readers
   behave exactly as they would with a plain radio group. */
.choice input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}

.choice__box {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.15rem 1.25rem;
  border: 1px solid var(--sand);
  border-radius: 3px;
  background: var(--cream);
  cursor: pointer;
  transition: border-color .2s ease, background .2s ease,
              box-shadow .2s ease, transform .2s ease;
}
.choice__box:hover { border-color: var(--sand-deep); background: var(--white); }

/* The radio itself. currentColor comes from .choice--yes / .choice--no. */
.choice__dot {
  position: relative;
  flex: none;
  width: 1.3rem;
  height: 1.3rem;
  border-radius: 50%;
  border: 1px solid var(--sand-deep);
  background: var(--white);
  transition: border-color .2s ease;
}
.choice__dot::after {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: currentColor;
  transform: scale(0);
  transition: transform .22s cubic-bezier(.34, 1.56, .64, 1);
}

.choice__text { flex: 1; min-width: 0; }
.choice__text strong {
  display: block;
  font-family: var(--serif);
  font-size: 1.28rem;
  font-weight: 400;
  line-height: 1.25;
  letter-spacing: .01em;
  text-transform: none;
  color: var(--ink);
}
.choice__text span {
  display: block;
  margin-top: .18rem;
  font-size: .66rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.choice__tick {
  flex: none;
  font-size: 1.05rem;
  line-height: 1;
  opacity: 0;
  transform: scale(.4);
  transition: opacity .2s ease, transform .25s cubic-bezier(.34, 1.56, .64, 1);
}

.choice--yes { color: var(--sage-deep); }
.choice--no  { color: var(--blush-deep); }

/* Selected. The border grows to 2px and the padding loses a pixel to match,
   so nothing shifts as you move between the two. */
.choice input:checked + .choice__box {
  border-width: 2px;
  padding: calc(1.15rem - 1px) calc(1.25rem - 1px);
  transform: translateY(-1px);
  box-shadow: 0 10px 24px -16px rgba(74, 63, 54, .55);
}
.choice input:checked + .choice__box .choice__dot { border-color: currentColor; }
.choice input:checked + .choice__box .choice__dot::after { transform: scale(1); }
.choice input:checked + .choice__box .choice__tick { opacity: 1; transform: none; }

.choice--yes input:checked + .choice__box { border-color: var(--sage-deep); background: #EFF3EC; }
.choice--no  input:checked + .choice__box { border-color: var(--blush-deep); background: #FAF0EC; }

.choice input:focus-visible + .choice__box {
  border-color: currentColor;
  box-shadow: 0 0 0 3px rgba(224, 174, 156, .35);
}

/* "Please choose one" turns both cards, since neither is picked yet. */
.field--error .choice__box { border-color: #C4705C; }

/* ---- Steps -----------------------------------------------------------------
   Each question sits in one of these and opens when the one above it has an
   answer. The script sets max-height as it opens — a fixed cap here would clip
   the party step, which grows a name box per companion after it is open. */

.reveal {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height .45s ease, opacity .35s ease;
}
.reveal.is-open { opacity: 1; }

/* ---- Companion counter -----------------------------------------------------
   Tapping is easier than typing on a phone, and the two buttons cannot produce
   a number the sheet would reject. They disable themselves at either end. */

.counter {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.1rem;
  max-width: 15rem;
  padding: .5rem .6rem;
  border: 1px solid var(--sand);
  border-radius: 3px;
  background: var(--cream);
}

.counter__btn {
  flex: none;
  width: 2.5rem;
  height: 2.5rem;
  font-family: var(--sans);
  font-size: 1.35rem;
  line-height: 1;
  color: var(--ink);
  background: var(--white);
  border: 1px solid var(--sand-deep);
  border-radius: 50%;
  cursor: pointer;
  transition: border-color .2s ease, color .2s ease,
              background .2s ease, transform .2s ease;
}
.counter__btn:hover:not(:disabled) {
  border-color: var(--blush);
  color: var(--blush-deep);
  transform: translateY(-1px);
}
.counter__btn:active:not(:disabled) { transform: none; }
.counter__btn:focus-visible {
  outline: none;
  border-color: var(--blush);
  box-shadow: 0 0 0 3px rgba(224, 174, 156, .3);
}
.counter__btn:disabled { opacity: .3; cursor: default; }

.counter__value { flex: 1; text-align: center; line-height: 1.1; }
.counter__value strong {
  display: block;
  font-family: var(--serif);
  font-size: 2rem;
  font-weight: 400;
  color: var(--ink);
}
.counter__value span {
  display: block;
  margin-top: .1rem;
  font-size: .6rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

/* Button */
.btn {
  display: block;
  width: 100%;
  margin-top: 2rem;
  padding: 1.05rem 1.5rem;
  font-family: var(--sans);
  font-size: .78rem;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--white);
  background: var(--ink);
  border: none;
  border-radius: 2px;
  cursor: pointer;
  transition: background .2s ease, transform .12s ease, opacity .2s ease;
}
.btn:hover:not(:disabled) { background: var(--blush-deep); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.form-error {
  display: none;
  margin-top: 1.2rem;
  padding: .85rem 1rem;
  background: #FDF4F1;
  border-left: 3px solid #C4705C;
  color: #8E4432;
  font-size: .92rem;
}
.form-error.is-visible { display: block; }

/* ---- Thank you ------------------------------------------------------------ */

.thanks { display: none; text-align: center; padding: 1rem 0 .5rem; }
.thanks.is-visible { display: block; animation: rise .6s ease both; }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}

.thanks__mark {
  font-size: 2.4rem;
  color: var(--blush);
  margin-bottom: .6rem;
}
.thanks__title {
  font-size: clamp(1.9rem, 6vw, 2.6rem);
  color: var(--ink);
  margin-bottom: .6rem;
}
.thanks__body { color: var(--ink-soft); max-width: 460px; margin: 0 auto; }
.thanks__again {
  display: inline-block;
  margin-top: 1.8rem;
  background: none;
  border: none;
  border-bottom: 1px solid var(--sand-deep);
  padding: 0 0 .2rem;
  font-family: var(--sans);
  font-size: .74rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  cursor: pointer;
}
.thanks__again:hover { color: var(--blush-deep); border-color: var(--blush-deep); }

/* ---- Closed state --------------------------------------------------------- */

.closed { text-align: center; }
.closed h3 { font-size: 2rem; margin-bottom: .6rem; }
.closed p { color: var(--ink-soft); max-width: 440px; margin: 0 auto; }

/* ---- Floating music control ------------------------------------------------ */

.music-dock {
  position: fixed;
  right: clamp(1rem, 3vw, 2rem);
  bottom: clamp(1rem, 3vw, 2rem);
  z-index: 40;
  display: flex;
  align-items: center;
  gap: .7rem;
}
.music-dock[hidden] { display: none; }

.music__hint {
  font-family: var(--sans);
  font-size: .64rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  background: rgba(251, 247, 241, .92);
  border: 1px solid var(--sand);
  border-radius: 999px;
  padding: .42rem .85rem;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
  opacity: 0;
  transform: translateX(6px);
  transition: opacity .4s ease, transform .4s ease;
  pointer-events: none;
}
.music__hint.is-shown { opacity: 1; transform: none; }

.music {
  position: relative;
  width: 3.4rem;
  height: 3.4rem;
  flex: none;
  border-radius: 50%;
  border: 1px solid var(--sand-deep);
  background: var(--cream);
  color: var(--blush-deep);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 26px -12px rgba(74, 63, 54, .55);
  transition: color .25s ease, border-color .25s ease, background .25s ease;
}
.music:hover { background: var(--white); border-color: var(--blush); }
.music:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(224, 174, 156, .4), 0 10px 26px -12px rgba(74, 63, 54, .55);
}

/* A soft ring that breathes outward while the song is playing. */
.music::after {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  border: 1px solid var(--blush);
  opacity: 0;
}
.music.is-playing::after { animation: ripple 2.4s ease-out infinite; }
@keyframes ripple {
  0%   { opacity: .55; transform: scale(1); }
  100% { opacity: 0;   transform: scale(1.55); }
}

.music__note {
  font-size: 1.25rem;
  line-height: 1;
  transition: opacity .2s ease, transform .2s ease;
}
.music.is-playing .music__note { opacity: 0; transform: scale(.6); }

/* Three little equaliser bars, shown in place of the note while playing. */
.music__bars {
  position: absolute;
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 1.1rem;
  opacity: 0;
  transform: scale(.6);
  transition: opacity .2s ease, transform .2s ease;
}
.music.is-playing .music__bars { opacity: 1; transform: none; }
.music__bars i {
  display: block;
  width: 3px;
  height: 40%;
  border-radius: 2px;
  background: var(--blush-deep);
}
.music.is-playing .music__bars i { animation: bounce 900ms ease-in-out infinite; }
.music.is-playing .music__bars i:nth-child(2) { animation-duration: 700ms; animation-delay: .12s; }
.music.is-playing .music__bars i:nth-child(3) { animation-duration: 1100ms; animation-delay: .05s; }
@keyframes bounce {
  0%, 100% { height: 30%; }
  50%      { height: 100%; }
}

@media (max-width: 480px) {
  .music { width: 3rem; height: 3rem; }
  .music__hint { font-size: .58rem; padding: .36rem .7rem; }
}

/* ---- Footer --------------------------------------------------------------- */

.footer {
  text-align: center;
  padding: 3.5rem 1.5rem 4rem;
  color: var(--ink-soft);
}
.footer__names {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.5rem;
  color: var(--ink);
  margin-bottom: .4rem;
}
.footer__meta { font-size: .72rem; letter-spacing: .24em; text-transform: uppercase; }

/* ---- Responsive ----------------------------------------------------------- */

@media (min-width: 1220px) {
  /* Once the photo stops touching the edges, let it sit like a printed plate. */
  .hero__photo {
    margin-top: 2.2rem;
    box-shadow: 0 26px 70px -42px rgba(74, 63, 54, .6);
  }
}

@media (max-width: 820px) {
  .details { grid-template-columns: 1fr; gap: 2rem; }
  .photo-frame { transform: none; max-width: 420px; margin: 0 auto; }
  /* On a phone the landscape photo is cropped square so the couple fills it. */
  .hero__photo { aspect-ratio: 1 / 1; max-height: 54vh; background-position: 50% 14%; }
  .section { padding: 3.2rem 1.25rem; }
  .form-card { padding: 2.2rem 1.4rem 2rem; }
}

/* Four cells plus their gaps have to clear a 320px screen, so tighten both. */
@media (max-width: 400px) {
  .countdown__units { gap: .7rem; }
  .countdown__unit { min-width: 2.7rem; }
  .countdown__unit strong { font-size: 1.7rem; }
  .countdown__unit span { font-size: .52rem; letter-spacing: .14em; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

</head>

<body>

<div class="petals" id="petals" aria-hidden="true"></div>

<div class="page">

  <!-- ===================== HERO ===================== -->
  <header class="hero">
    <div class="hero__photo" id="heroPhoto" role="img"
         aria-label="Griffin and Hazel on the beach"></div>

    <div class="hero__inner">
      <div class="monogram" id="monogram" data-reveal>
        <svg class="monogram__ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="48"></circle>
        </svg>
        <span class="monogram__text" id="monogramText"></span>
      </div>

      <p class="eyebrow" id="invitationLine" data-reveal></p>

      <h1 class="hero__names script">
        <span class="hero__name" id="groomFirst" data-reveal></span>
        <span class="amp" data-reveal>&amp;</span>
        <span class="hero__name" id="brideFirst" data-reveal></span>
      </h1>

      <div class="rule" data-reveal><span class="rule__mark">&#10022;</span></div>

      <p class="hero__date" id="heroDate" data-reveal></p>

      <div class="countdown" id="countdown" data-reveal></div>

      <a class="scroll-cue" href="#rsvp" data-reveal
         aria-label="Go to the RSVP form">&#8964;</a>
    </div>
  </header>

  <!-- ===================== DETAILS ===================== -->
  <section class="section">
    <h2 class="section__title script" data-reveal>The Celebration</h2>
    <div class="rule" data-reveal><span class="rule__mark">&#10022;</span></div>

    <div class="details">
      <div class="cards">
        <div class="card" data-reveal>
          <div class="card__label" id="ceremonyTitle"></div>
          <div class="card__venue" id="ceremonyVenue"></div>
          <div class="card__meta" id="ceremonyMeta"></div>
        </div>

        <div class="card" data-reveal>
          <div class="card__label" id="receptionTitle"></div>
          <div class="card__venue" id="receptionVenue"></div>
          <div class="card__meta" id="receptionMeta"></div>
        </div>
      </div>

      <figure class="photo-frame" data-reveal>
        <div class="photo-frame__img" role="img"
             aria-label="Griffin and Hazel walking along the shore"></div>
        <figcaption class="photo-frame__caption" id="closingNote"></figcaption>
      </figure>
    </div>
  </section>

  <!-- ===================== RSVP ===================== -->
  <section class="section rsvp" id="rsvp">
    <div class="form-card" data-reveal>

      <!-- Form -->
      <div id="formPane">
        <div class="form-intro">
          <h2 class="section__title script">Kindly Reply</h2>
          <p id="requestLine"></p>
          <span class="deadline" id="deadline"></span>
        </div>

        <form id="rsvpForm" novalidate>

          <!-- Hidden from people, catnip for bots. Must stay empty. -->
          <div class="hp" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <div class="field" id="f-name">
            <label for="name">Full Name <span class="req">*</span></label>
            <input type="text" id="name" name="name" autocomplete="name"
                   placeholder="Juan Dela Cruz" maxlength="80" required>
            <p class="field__error" id="e-name"></p>
          </div>

          <!-- One question at a time. Each step opens itself once the step
               above it has an answer; the script does the opening. -->
          <div class="reveal" id="step-attending">
            <div class="field" id="f-attending">
              <span class="fieldset__legend">Will you be joining us? <span class="req">*</span></span>
              <div class="choices" role="radiogroup" aria-label="Will you be joining us?">
                <label class="choice choice--yes">
                  <input type="radio" name="attending" value="yes">
                  <span class="choice__box">
                    <span class="choice__dot" aria-hidden="true"></span>
                    <span class="choice__text">
                      <strong>Yes, I'll be there</strong>
                      <span>Joyfully accepts</span>
                    </span>
                    <span class="choice__tick" aria-hidden="true">&#10003;</span>
                  </span>
                </label>

                <label class="choice choice--no">
                  <input type="radio" name="attending" value="no">
                  <span class="choice__box">
                    <span class="choice__dot" aria-hidden="true"></span>
                    <span class="choice__text">
                      <strong>Sorry, I can't make it</strong>
                      <span>Regretfully declines</span>
                    </span>
                    <span class="choice__tick" aria-hidden="true">&#10003;</span>
                  </span>
                </label>
              </div>
              <p class="field__error" id="e-attending"></p>
            </div>
          </div>

          <div class="reveal" id="step-companions">
            <div class="field" id="f-companions">
              <span class="fieldset__legend" id="companionsLegend">
                Will anyone be coming with you? <span class="req">*</span>
              </span>
              <div class="choices" role="radiogroup" aria-labelledby="companionsLegend">
                <label class="choice choice--yes">
                  <input type="radio" name="companions" value="yes">
                  <span class="choice__box">
                    <span class="choice__dot" aria-hidden="true"></span>
                    <span class="choice__text">
                      <strong>Yes, I'm bringing someone</strong>
                      <span id="companionsYesHint"></span>
                    </span>
                    <span class="choice__tick" aria-hidden="true">&#10003;</span>
                  </span>
                </label>

                <label class="choice choice--no">
                  <input type="radio" name="companions" value="no">
                  <span class="choice__box">
                    <span class="choice__dot" aria-hidden="true"></span>
                    <span class="choice__text">
                      <strong>No, just me</strong>
                      <span>One seat</span>
                    </span>
                    <span class="choice__tick" aria-hidden="true">&#10003;</span>
                  </span>
                </label>
              </div>
              <p class="field__error" id="e-companions"></p>
            </div>
          </div>

          <div class="reveal" id="step-party">
            <div class="field" id="f-partySize">
              <span class="fieldset__legend" id="companionCountLegend">
                How many are coming with you?
              </span>
              <div class="counter" role="group" aria-labelledby="companionCountLegend">
                <button type="button" class="counter__btn" id="companionMinus"
                        aria-label="One fewer companion">&minus;</button>
                <span class="counter__value">
                  <strong id="companionCount">1</strong>
                  <span id="companionCountWord">companion</span>
                </span>
                <button type="button" class="counter__btn" id="companionPlus"
                        aria-label="One more companion">+</button>
              </div>
              <span class="hint" id="seatsHint" aria-live="polite"></span>
              <p class="field__error" id="e-partySize"></p>
            </div>

            <div class="field" id="f-guestNames">
              <span class="fieldset__legend" id="guestNamesLabel">Who Is Coming With You?</span>
              <div class="guests" id="guestNameList" role="group"
                   aria-labelledby="guestNamesLabel"></div>
              <span class="hint">So we can set your place cards correctly.</span>
            </div>
          </div>

          <div class="reveal" id="step-message">
            <div class="field" id="f-message">
              <label for="message">A Message for Griffin &amp; Hazel</label>
              <textarea id="message" name="message" maxlength="1000"
                        placeholder="Share a wish, a blessing, or a favourite memory..."></textarea>
              <span class="hint"><span id="msgCount">0</span> / 1000</span>
            </div>

            <button type="submit" class="btn" id="submitBtn">Send Our Reply</button>
            <div class="form-error" id="formError"></div>
          </div>
        </form>
      </div>

      <!-- Thank you -->
      <div class="thanks" id="thanksPane">
        <div class="thanks__mark">&#10022;</div>
        <h2 class="thanks__title script" id="thanksTitle"></h2>
        <p class="thanks__body" id="thanksBody"></p>
        <button type="button" class="thanks__again" id="againBtn">Submit another reply</button>
      </div>

      <!-- RSVPs closed -->
      <div class="closed" id="closedPane" style="display:none">
        <h3 class="script">Our guest list has closed</h3>
        <p id="closedBody"></p>
      </div>

    </div>
  </section>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <div class="rule" data-reveal><span class="rule__mark">&#10022;</span></div>
    <div class="footer__names" id="footerNames" data-reveal></div>
    <div class="footer__meta" id="footerMeta" data-reveal></div>
  </footer>

</div>

<!-- ===================== MUSIC ===================== -->
<div class="music-dock" id="musicDock" hidden>
  <span class="music__hint" id="musicHint"></span>
  <button type="button" class="music" id="musicBtn"
          aria-pressed="false" aria-label="Play background music">
    <span class="music__note" aria-hidden="true">&#9834;</span>
    <span class="music__bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
</div>
<audio id="music" loop preload="none"></audio>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var firstName = function (full) { return String(full || '').trim().split(/\s+/)[0] || ''; };

  var esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  };


  /* ---------------------------------------------------------------------- */
  /*  Transport                                                             */
  /*                                                                        */
  /*  The same page runs in two places:                                     */
  /*    · served by Apps Script  -> google.script.run is available          */
  /*    · served from your own domain -> POST to the web app instead        */
  /*                                                                        */
  /*  The fetch deliberately sends text/plain. Any other content type makes */
  /*  the browser send a CORS preflight, which Apps Script cannot answer.   */
  /* ---------------------------------------------------------------------- */

  var hosted = !!(window.google && window.google.script && window.google.script.run);
  var ENDPOINT = window.RSVP_ENDPOINT || '';

  function send(payload, onDone, onFail) {
    if (hosted) {
      google.script.run
        .withSuccessHandler(onDone)
        .withFailureHandler(onFail)
        .submitRsvp(payload);
      return;
    }

    if (!ENDPOINT || ENDPOINT.indexOf('http') !== 0) {
      // The site was published before the Apps Script endpoint was filled in.
      // Say so plainly rather than blaming the guest's connection.
      console.error('RSVP_ENDPOINT is not set. Rebuild with: ' +
        'python3 tools/build_site.py pages --endpoint <your /exec URL>');
      onDone({
        ok: false,
        error: 'This form is not connected yet. Please let ' +
          firstName(CONFIG.groom) + ' and ' + firstName(CONFIG.bride) + ' know.'
      });
      return;
    }

    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: 'follow'
    })
      .then(function (response) { return response.json(); })
      .then(onDone)
      .catch(onFail);
  }


  /**
   * Apps Script decides this server-side. On a static host we work it out
   * here — the server checks again before writing anything, so a wrong clock
   * on someone's laptop cannot get a late reply through.
   */
  function rsvpIsOpen() {
    if (typeof CONFIG.isOpen === 'boolean') {
      return CONFIG.isOpen;
    }
    if (!CONFIG.rsvpDeadlineIso) {
      return true;
    }
    var now = new Date();
    var today = now.getFullYear() + '-' +
      ('0' + (now.getMonth() + 1)).slice(-2) + '-' +
      ('0' + now.getDate()).slice(-2);
    return today <= CONFIG.rsvpDeadlineIso;
  }


  /* ---------------------------------------------------------------------- */
  /*  Paint the page from CONFIG                                            */
  /* ---------------------------------------------------------------------- */

  function render() {
    $('invitationLine').textContent = CONFIG.invitationLine;

    // One span per character so the letters can arrive in turn.
    $('monogramText').innerHTML = String(CONFIG.monogram).split('').map(function (ch) {
      return ch === ' ' ? ' ' : '<span class="monogram__ch">' + esc(ch) + '</span>';
    }).join('');

    $('groomFirst').textContent = firstName(CONFIG.groom);
    $('brideFirst').textContent = firstName(CONFIG.bride);
    $('heroDate').textContent =
      CONFIG.weddingDateLong + ' · ' + CONFIG.ceremony.city;

    $('ceremonyTitle').textContent = CONFIG.ceremony.title;
    $('ceremonyVenue').textContent = CONFIG.ceremony.venue;
    $('ceremonyMeta').textContent =
      [CONFIG.ceremony.time, CONFIG.ceremony.city].filter(Boolean).join(' · ');

    $('receptionTitle').textContent = CONFIG.reception.title;
    $('receptionVenue').textContent = CONFIG.reception.venue;
    $('receptionMeta').textContent =
      [CONFIG.reception.time, CONFIG.reception.city].filter(Boolean).join(' · ');

    $('closingNote').textContent = CONFIG.closingNote;
    $('requestLine').textContent =
      CONFIG.groom + ' and ' + CONFIG.bride + ' ' + CONFIG.requestLine + '.';
    $('deadline').textContent = 'Kindly reply by ' + CONFIG.rsvpDeadlineLabel;

    $('footerNames').textContent = firstName(CONFIG.groom) + ' & ' + firstName(CONFIG.bride);
    $('footerMeta').textContent =
      CONFIG.weddingDateShort + '  ·  ' + CONFIG.ceremony.city;

    $('closedBody').textContent =
      'Replies closed on ' + CONFIG.rsvpDeadlineLabel +
      '. If you still need to reach ' + firstName(CONFIG.groom) + ' and ' +
      firstName(CONFIG.bride) + ', please message them directly.';

    // How many companions the counter will allow
    var most = Math.max(1, CONFIG.maxPartySize - 1);
    $('companionsYesHint').textContent =
      most === 1 ? 'One companion' : 'Up to ' + most + ' companions';

    if (!rsvpIsOpen()) {
      $('formPane').style.display = 'none';
      $('closedPane').style.display = 'block';
    }

    renderCountdown();
  }


  /* ---------------------------------------------------------------------- */
  /*  Countdown                                                             */
  /*                                                                        */
  /*  Ticks every second down to midnight on the wedding day. The cells are  */
  /*  built once and only their numbers are rewritten, so the entrance       */
  /*  animation can hold them without fighting the interval.                 */
  /* ---------------------------------------------------------------------- */

  var COUNTDOWN_UNITS = [
    { key: 'days', label: 'Days' },
    { key: 'hours', label: 'Hours' },
    { key: 'minutes', label: 'Minutes' },
    { key: 'seconds', label: 'Seconds' }
  ];

  var countdownCells = null;   // unit key -> the <strong> holding its number
  var countdownTimer = null;
  var countdownHeld = false;   // true while countUp() owns the numbers
  var countdownValues = { days: 0, hours: 0, minutes: 0, seconds: 0 };

  function weddingMoment() {
    var parts = CONFIG.weddingDateIso.split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function renderCountdown() {
    var el = $('countdown');
    if (weddingMoment() - new Date() <= 0) {
      paintCountdownMessage(el);
      return;
    }

    var html = '<div class="countdown__units">';
    for (var i = 0; i < COUNTDOWN_UNITS.length; i++) {
      html += '<div class="countdown__unit">' +
                '<strong data-unit="' + COUNTDOWN_UNITS[i].key + '">0</strong>' +
                '<span>' + COUNTDOWN_UNITS[i].label + '</span>' +
              '</div>';
    }
    el.innerHTML = html + '</div><p class="countdown__caption">until we say I do</p>';

    countdownCells = {};
    for (var j = 0; j < COUNTDOWN_UNITS.length; j++) {
      var key = COUNTDOWN_UNITS[j].key;
      countdownCells[key] = el.querySelector('[data-unit="' + key + '"]');
    }

    tickCountdown();
    countdownTimer = setInterval(tickCountdown, 1000);
  }

  function tickCountdown() {
    var remaining = weddingMoment() - new Date();

    if (remaining <= 0) {
      clearInterval(countdownTimer);
      countdownTimer = null;
      countdownCells = null;
      paintCountdownMessage($('countdown'));
      return;
    }

    var total = Math.floor(remaining / 1000);
    countdownValues = {
      days: Math.floor(total / 86400),
      hours: Math.floor(total / 3600) % 24,
      minutes: Math.floor(total / 60) % 60,
      seconds: total % 60
    };

    if (!countdownHeld) {
      paintCountdown(countdownValues);
    }
  }

  function paintCountdown(v) {
    if (!countdownCells) {
      return;
    }
    for (var i = 0; i < COUNTDOWN_UNITS.length; i++) {
      var key = COUNTDOWN_UNITS[i].key;
      var cell = countdownCells[key];
      // Days is the only one that can run past two digits, so it stays bare.
      var text = key === 'days' ? String(v[key]) : pad2(v[key]);
      if (cell && cell.textContent !== text) {
        cell.textContent = text;
      }
    }
  }

  /** The day itself, and everything after it. */
  function paintCountdownMessage(el) {
    var since = new Date() - weddingMoment();
    el.innerHTML = since < 86400000
      ? '<strong>Today</strong> is the day'
      : '<strong>' + esc(CONFIG.weddingYear) + '</strong>';
  }


  /* ---------------------------------------------------------------------- */
  /*  Form behaviour                                                        */
  /* ---------------------------------------------------------------------- */

  function clearErrors() {
    ['name', 'attending', 'companions', 'partySize'].forEach(function (f) {
      var wrap = $('f-' + f);
      if (wrap) { wrap.classList.remove('field--error'); }
    });
    $('formError').classList.remove('is-visible');
  }

  function showFieldError(field, message) {
    var wrap = $('f-' + field);
    var slot = $('e-' + field);
    if (wrap && slot) {
      wrap.classList.add('field--error');
      slot.textContent = message;
      wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return true;
    }
    return false;
  }

  function showFormError(message) {
    var box = $('formError');
    box.textContent = message;
    box.classList.add('is-visible');
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }


  function checkedValue(group) {
    var checked = document.querySelector('input[name="' + group + '"]:checked');
    return checked ? checked.value : '';
  }

  function attendingValue() { return checkedValue('attending'); }
  function companionsValue() { return checkedValue('companions'); }


  /* ---------------------------------------------------------------------- */
  /*  The steps                                                             */
  /*                                                                        */
  /*  The form asks one thing at a time: a name, then whether they are       */
  /*  coming, then whether anyone is coming with them, and only then how     */
  /*  many and who. Every step is a .reveal that syncSteps() opens or closes  */
  /*  from the answers so far, so there is no order of clicks that can leave  */
  /*  a question stranded on the page.                                       */
  /*                                                                        */
  /*  A step measures itself as it opens and then releases the cap, because  */
  /*  the party step keeps growing after it is open — its name boxes appear   */
  /*  as the companion count goes up.                                        */
  /* ---------------------------------------------------------------------- */

  var STEP_MS = 460;          // a shade past the .45s max-height transition

  function toggleStep(id, open) {
    var el = $(id);
    if (!el || open === el.classList.contains('is-open')) { return; }

    if (open) {
      el.style.maxHeight = el.scrollHeight + 'px';
      el.classList.add('is-open');
      setTimeout(function () {
        if (el.classList.contains('is-open')) {
          el.style.maxHeight = 'none';    // let it grow with its contents
          el.style.overflow = 'visible';  // so focus rings are not clipped
        }
      }, STEP_MS);
    } else {
      el.style.overflow = '';
      el.style.maxHeight = el.scrollHeight + 'px';
      el.offsetHeight;                    // flush, so the close has somewhere to start
      el.classList.remove('is-open');
      el.style.maxHeight = '';
    }
  }

  var askedAttending = false;   // once the name question is answered it stays answered

  function syncSteps() {
    var attending = attendingValue();
    askedAttending = askedAttending || $('name').value.trim().length >= 2 || !!attending;

    toggleStep('step-attending', askedAttending);
    toggleStep('step-companions', attending === 'yes');
    toggleStep('step-party', attending === 'yes' && companionsValue() === 'yes');
    toggleStep('step-message', !!attending);
  }


  /* ---------------------------------------------------------------------- */
  /*  How many, and who                                                     */
  /*                                                                        */
  /*  The counter holds companions rather than seats, since the guest        */
  /*  filling the form in is already accounted for. One name box per         */
  /*  companion. Boxes already on the page are left alone when the count     */
  /*  changes, so a name typed before a correction is not thrown away.       */
  /* ---------------------------------------------------------------------- */

  var companions = 1;

  function maxCompanions() {
    return Math.max(1, CONFIG.maxPartySize - 1);
  }

  function partySeats() {
    return companionsValue() === 'yes' ? companions + 1 : 1;
  }

  function setCompanions(count) {
    companions = Math.min(maxCompanions(), Math.max(1, count));

    $('companionCount').textContent = String(companions);
    $('companionCountWord').textContent = companions === 1 ? 'companion' : 'companions';
    $('companionMinus').disabled = companions <= 1;
    $('companionPlus').disabled = companions >= maxCompanions();

    var seats = companions + 1;
    $('seatsHint').textContent = 'That makes ' + seats + ' seats in total, including you.';

    renderGuestNames();
  }

  function guestNameInputs() {
    return Array.prototype.slice.call($('guestNameList').getElementsByTagName('input'));
  }

  function guestNameRow(seat) {
    var row = document.createElement('div');
    row.className = 'guest';

    var label = document.createElement('label');
    label.className = 'guest__label';
    label.setAttribute('for', 'guestName' + seat);
    label.textContent = 'Guest ' + seat;

    var input = document.createElement('input');
    input.type = 'text';
    input.id = 'guestName' + seat;
    input.className = 'guest__input';
    input.maxLength = 80;
    input.placeholder = 'Full name';
    input.autocomplete = 'off';

    row.appendChild(label);
    row.appendChild(input);
    return row;
  }

  function renderGuestNames() {
    var list = $('guestNameList');
    var wanted = partySeats() - 1;
    var rows = guestNameInputs();

    for (var i = rows.length; i > wanted; i--) {
      list.removeChild(rows[i - 1].parentNode);
    }
    for (var j = rows.length; j < wanted; j++) {
      list.appendChild(guestNameRow(j + 2));   // guest 1 is the person replying
    }

    $('f-guestNames').style.display = wanted ? '' : 'none';
  }

  function guestNamesValue() {
    return guestNameInputs()
      .map(function (input) { return input.value.trim(); })
      .filter(Boolean)
      .join(', ');
  }


  function wireUp() {
    // The name opens the attendance question
    $('name').addEventListener('input', syncSteps);

    Array.prototype.forEach.call(
      document.querySelectorAll('input[name="attending"]'),
      function (radio) {
        radio.addEventListener('change', function () {
          $('f-attending').classList.remove('field--error');
          syncSteps();
        });
      }
    );

    Array.prototype.forEach.call(
      document.querySelectorAll('input[name="companions"]'),
      function (radio) {
        radio.addEventListener('change', function () {
          $('f-companions').classList.remove('field--error');
          syncSteps();
          renderGuestNames();
        });
      }
    );

    $('companionMinus').addEventListener('click', function () {
      setCompanions(companions - 1);
    });
    $('companionPlus').addEventListener('click', function () {
      setCompanions(companions + 1);
    });

    // Live character count on the message
    $('message').addEventListener('input', function () {
      $('msgCount').textContent = this.value.length;
    });

    $('rsvpForm').addEventListener('submit', onSubmit);
    $('againBtn').addEventListener('click', resetForm);

    setCompanions(companions);
  }


  function onSubmit(event) {
    event.preventDefault();
    clearErrors();

    var attending = attendingValue();

    var payload = {
      name: $('name').value,
      attending: attending,
      partySize: String(attending === 'yes' ? partySeats() : 0),
      guestNames: attending === 'yes' ? guestNamesValue() : '',
      message: $('message').value,
      website: $('website').value
    };

    // Cheap client-side checks first, so the round trip is not wasted
    if (payload.name.trim().length < 2) {
      return showFieldError('name', 'Please tell us your full name.');
    }
    if (!attending) {
      return showFieldError('attending', 'Please choose one so we know to save you a seat.');
    }
    if (attending === 'yes' && !companionsValue()) {
      return showFieldError('companions', 'Please let us know if anyone is coming with you.');
    }

    setBusy(true);
    send(payload, onSuccess, onFailure);
  }


  function setBusy(busy) {
    var btn = $('submitBtn');
    btn.disabled = busy;
    btn.textContent = busy ? 'Sending…' : 'Send Our Reply';
  }


  function onSuccess(result) {
    setBusy(false);

    if (!result || !result.ok) {
      var message = (result && result.error) || 'Something went wrong. Please try again.';
      if (!(result && result.field && showFieldError(result.field, message))) {
        showFormError(message);
      }
      return;
    }

    var name = firstName(result.name);

    $('thanksTitle').textContent = result.attending
      ? 'Thank you, ' + name + '!'
      : 'Thank you, ' + name;

    if (result.attending) {
      $('thanksBody').textContent =
        (result.updated ? 'We have updated your reply. ' : '') +
        'We have saved ' +
        (result.partySize === 1 ? 'a seat' : result.partySize + ' seats') +
        ' for you on ' + CONFIG.weddingDateShort + ' at ' +
        CONFIG.ceremony.venue + ', with the reception to follow at ' +
        CONFIG.reception.venue + '. ' + CONFIG.closingNote;
    } else {
      $('thanksBody').textContent =
        (result.updated ? 'We have updated your reply. ' : '') +
        'We will miss you dearly, but we are so grateful for your love and ' +
        'prayers from afar. Thank you for letting us know.';
    }

    $('formPane').style.display = 'none';
    $('thanksPane').classList.add('is-visible');
    document.getElementById('rsvp').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }


  function onFailure(error) {
    setBusy(false);
    console.error(error);
    showFormError('We could not reach the server. Please check your connection and try again.');
  }


  function resetForm() {
    $('thanksPane').classList.remove('is-visible');
    $('formPane').style.display = 'block';   // steps measure themselves, so show first

    $('rsvpForm').reset();
    askedAttending = false;
    setCompanions(1);            // also clears the name boxes back to none
    syncSteps();
    $('msgCount').textContent = '0';
    clearErrors();
    document.getElementById('rsvp').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }


  /* ---------------------------------------------------------------------- */
  /*  Motion                                                                */
  /*                                                                        */
  /*  The .anim class on <html> tells us GSAP loaded and the guest has not   */
  /*  asked for reduced motion. Without it we do nothing at all — the CSS    */
  /*  that hides these elements is scoped to the same class.                */
  /* ---------------------------------------------------------------------- */

  var animating = document.documentElement.className.indexOf('anim') > -1;

  function animateHero() {
    // Start states go in before the timeline, so nothing has a chance to
    // render at its final position first.
    gsap.set('.hero [data-reveal]', { y: 22 });
    gsap.set('.monogram', { scale: .8 });
    gsap.set('.monogram__ch', { opacity: 0, y: 9 });

    var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

    tl.to('.hero__photo', { opacity: 1, duration: 1.5, ease: 'power2.out' })
      .from('.hero__photo', { scale: 1.05, duration: 2.4, ease: 'power2.out' }, 0)
      // Every one of these clears the y offset set above. Animating only
      // opacity leaves the element parked 22px low for good.
      .to('.monogram', { opacity: 1, y: 0, scale: 1, duration: .7, ease: 'power2.out' }, '-=0.9')
      // the ring unrolls from twelve o'clock, and the letters follow it in
      .to('.monogram__ring circle',
          { strokeDashoffset: 0, duration: 1.15, ease: 'power2.inOut' }, '-=0.5')
      .to('.monogram__ch',
          { opacity: 1, y: 0, duration: .55, stagger: .12 }, '-=0.72')
      .to('#invitationLine', { opacity: 1, y: 0, duration: .7 }, '-=0.3')
      .to('.hero__names [data-reveal]', {
        opacity: 1, y: 0, duration: .9, stagger: .13
      }, '-=0.4')
      .to('.hero .rule', { opacity: 1, y: 0, duration: .8 }, '-=0.5')
      .to('#heroDate', { opacity: 1, y: 0, duration: .7 }, '-=0.45')
      .to('#countdown', { opacity: 1, y: 0, duration: .7, onStart: countUp }, '-=0.45')
      .to('.scroll-cue', { opacity: 1, y: 0, duration: .6 }, '-=0.3');
  }


  /** Runs every countdown number up from zero rather than just appearing. */
  function countUp() {
    if (!countdownCells) {
      return;
    }

    // The interval keeps computing while this runs; countdownHeld stops it
    // repainting over the tween, and onComplete hands the numbers back.
    countdownHeld = true;

    var proxy = { days: 0, hours: 0, minutes: 0, seconds: 0 };
    gsap.to(proxy, {
      days: countdownValues.days,
      hours: countdownValues.hours,
      minutes: countdownValues.minutes,
      seconds: countdownValues.seconds,
      duration: 1.6,
      ease: 'power2.out',
      onUpdate: function () {
        paintCountdown({
          days: Math.round(proxy.days),
          hours: Math.round(proxy.hours),
          minutes: Math.round(proxy.minutes),
          seconds: Math.round(proxy.seconds)
        });
      },
      onComplete: function () {
        countdownHeld = false;
        paintCountdown(countdownValues);
      }
    });
  }


  /**
   * Everything below the fold rises into place as it is scrolled to.
   *
   * This reveals anything whose top has passed the trigger line, rather than
   * anything currently intersecting the viewport. The difference matters: the
   * scroll cue is an anchor that jumps straight to the form, and anything
   * merely observed for intersection would be skipped over and stay invisible
   * for the rest of the visit.
   */
  function animateOnScroll() {
    var items = [].slice.call(document.querySelectorAll('[data-reveal]'))
      .filter(function (el) { return !el.closest('.hero'); });

    gsap.set(items, { y: 30 });

    var pending = items.slice();
    var queued = false;

    function reveal() {
      queued = false;
      var line = window.innerHeight * 0.88;
      var arriving = [];

      pending = pending.filter(function (el) {
        if (el.getBoundingClientRect().top < line) {
          arriving.push(el);
          return false;
        }
        return true;
      });

      if (arriving.length) {
        gsap.to(arriving, {
          opacity: 1, y: 0, duration: .9, stagger: .12, ease: 'power3.out'
        });
      }
      if (!pending.length) {
        window.removeEventListener('scroll', onScroll);
        window.removeEventListener('resize', onScroll);
      }
    }

    function onScroll() {
      if (!queued) {
        queued = true;
        requestAnimationFrame(reveal);
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    reveal();
  }


  /** Petals, drifting down and swaying, forever. */
  function startPetals() {
    if (!CONFIG.petals) {
      return;
    }
    var layer = $('petals');
    var count = CONFIG.petalCount || 12;
    var tints = ['#E8C4B8', '#F0D6C2', '#EFE2D2', '#D9C7B4'];
    var rand = gsap.utils.random;

    for (var i = 0; i < count; i++) {
      var petal = document.createElement('span');
      var size = rand(7, 15);
      petal.className = 'petal';
      petal.style.width = size + 'px';
      petal.style.height = (size * 0.72) + 'px';
      petal.style.background = tints[i % tints.length];
      layer.appendChild(petal);
      float(petal);
    }

    function float(petal) {
      var duration = rand(14, 26);

      gsap.set(petal, { left: rand(0, 100) + 'vw', rotate: rand(0, 360) });

      var tl = gsap.timeline({
        repeat: -1,
        onRepeat: function () {
          gsap.set(petal, { left: rand(0, 100) + 'vw' });
        }
      })
        .to(petal, { opacity: rand(0.18, 0.42), duration: 2 }, 0)
        .to(petal, { y: '112vh', duration: duration, ease: 'none' }, 0)
        .to(petal, {
          x: rand(-70, 70),
          duration: duration / 3,
          repeat: 2,
          yoyo: true,
          ease: 'sine.inOut'
        }, 0)
        .to(petal, { rotate: '+=' + rand(180, 540), duration: duration, ease: 'none' }, 0)
        .to(petal, { opacity: 0, duration: 3 }, duration - 3);

      // Drop each petal in part-way through its fall, so the sky is not empty
      // for the first half-minute.
      tl.seek(rand(0, duration));
    }
  }


  /**
   * A slow gold highlight travelling across the monogram, the way foil on
   * printed stationery catches the light when the card is tilted.
   */
  function shimmerMonogram() {
    var wrap = $('monogramText');
    var chars = [].slice.call(document.querySelectorAll('.monogram__ch'));

    var supported = window.CSS && CSS.supports &&
      (CSS.supports('-webkit-background-clip', 'text') ||
       CSS.supports('background-clip', 'text'));

    if (!wrap || !chars.length || !supported) {
      return;
    }

    var BAND = 2.5;          // gradient width, as a multiple of the monogram
    var FROM = -1.6;         // band starts this far left of the lettering
    var TO = 0.1;            // and finishes just past its right edge
    var progress = { t: 0 };
    var width = 0;
    var offsets = [];

    /**
     * Each glyph paints its own copy of the gradient, so each is told where
     * it sits within the whole monogram. Offsetting every glyph's background
     * by its own position leaves one continuous band across all of them.
     */
    function measure() {
      var box = wrap.getBoundingClientRect();
      width = box.width || 1;
      offsets = chars.map(function (ch) {
        return ch.getBoundingClientRect().left - box.left;
      });
      chars.forEach(function (ch) {
        ch.style.backgroundSize = (width * BAND) + 'px 100%';
      });
      paint();
    }

    function paint() {
      var x = (FROM + (TO - FROM) * progress.t) * width;
      for (var i = 0; i < chars.length; i++) {
        chars[i].style.backgroundPositionX = (x - offsets[i]) + 'px';
      }
    }

    measure();
    wrap.classList.add('is-foil');

    // Widths shift when the serif finishes loading, and again on rotation.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(measure);
    }
    window.addEventListener('resize', measure);

    // Position is derived from a 0-to-1 progress rather than baked-in pixels,
    // and re-measured as each pass begins. The first measurement happens while
    // the entrance is still scaling the medallion up, so anything captured
    // then would leave the band running in a coordinate space a fifth too
    // small for the rest of the evening.
    gsap.to(progress, {
      t: 1,
      duration: 1.9,
      ease: 'power2.inOut',
      delay: 3.2,
      repeat: -1,
      repeatDelay: 4.6,
      onStart: measure,
      onRepeat: measure,
      onUpdate: paint
    });
  }


  function initMotion() {
    if (!animating) {
      return;
    }
    animateHero();
    animateOnScroll();
    startPetals();
    shimmerMonogram();
  }


  /* ---------------------------------------------------------------------- */
  /*  Music                                                                 */
  /* ---------------------------------------------------------------------- */

  function initMusic() {
    var settings = CONFIG.music || {};
    var src = window.RSVP_MUSIC_SRC || '';

    if (!settings.enabled || !src) {
      return;
    }

    var audio = $('music');
    var button = $('musicBtn');
    var dock = $('musicDock');
    var hint = $('musicHint');
    var chosen = false;   // true once the guest has used the button themselves

    audio.src = src;
    audio.volume = typeof settings.volume === 'number' ? settings.volume : 0.32;
    dock.hidden = false;
    hint.textContent = settings.label || 'Play our song';

    var bob = null;

    if (animating) {
      gsap.from(dock, { opacity: 0, y: 20, duration: .8, delay: 1.6, ease: 'power3.out' });

      // The gentle float that draws the eye to it. It settles while the guest
      // is reaching for it, and stops for good once they have used it — a
      // control that never stops moving is a control that is hard to hit.
      bob = gsap.to(button, {
        y: -6, duration: 2.4, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 2.4
      });

      var settle = function () {
        if (bob) { bob.pause(); }
        gsap.to(button, { y: 0, duration: .3, ease: 'power2.out' });
      };
      var resume = function () {
        if (bob && !chosen) { bob.play(); }
      };

      button.addEventListener('mouseenter', settle);
      button.addEventListener('focus', settle);
      button.addEventListener('mouseleave', resume);
      button.addEventListener('blur', resume);

      button.addEventListener('click', function () {
        if (bob) { bob.kill(); bob = null; }
        gsap.to(button, { y: 0, duration: .3 });
      });
    }

    var showHintFor = function (ms) {
      hint.classList.add('is-shown');
      setTimeout(function () { hint.classList.remove('is-shown'); }, ms);
    };

    function paint(playing) {
      button.classList.toggle('is-playing', playing);
      button.setAttribute('aria-pressed', playing ? 'true' : 'false');
      button.setAttribute('aria-label',
        playing ? 'Pause background music' : 'Play background music');
      hint.textContent = playing ? 'Now playing' : (settings.label || 'Play our song');
    }

    audio.addEventListener('play', function () { paint(true); });
    audio.addEventListener('pause', function () { paint(false); });

    function play() {
      var attempt = audio.play();
      if (attempt && attempt.catch) {
        // Blocked by autoplay policy, or the file is missing. Either way the
        // button stays where it is and the guest can try it themselves.
        attempt.catch(function () { paint(false); });
      }
    }

    button.addEventListener('click', function () {
      chosen = true;
      if (audio.paused) {
        play();
      } else {
        audio.pause();
      }
    });

    button.addEventListener('mouseenter', function () { hint.classList.add('is-shown'); });
    button.addEventListener('mouseleave', function () { hint.classList.remove('is-shown'); });

    // Nudge them once, a moment after the page settles.
    setTimeout(function () {
      if (audio.paused) { showHintFor(4200); }
    }, 2600);

    // Browsers will not let audio start until the guest has interacted with
    // the page, so their first tap anywhere is the earliest chance we get.
    if (settings.startOnFirstTap) {
      var stopListening = function () {
        window.removeEventListener('pointerdown', kick, true);
        window.removeEventListener('keydown', kick, true);
      };

      var kick = function (event) {
        // A tap on the button itself is the button's business — starting the
        // song here too would leave its own handler to pause it again.
        if (!(event && event.target && dock.contains(event.target))) {
          if (!chosen && audio.paused) { play(); }
        }
        stopListening();
      };

      window.addEventListener('pointerdown', kick, true);
      window.addEventListener('keydown', kick, true);
    }
  }


  /* ---------------------------------------------------------------------- */

  render();
  wireUp();
  initMotion();
  initMusic();
})();
</script>

</body>
</html>
