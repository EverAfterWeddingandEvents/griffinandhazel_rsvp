<style>
/* =============================================================================
   Griffin & Hazel — RSVP
   Palette lifted from the engagement photos: warm sand, sea haze, blush
   florals, sage leaves, cream linen.
   ========================================================================== */

:root {
  --cream:      #FBF7F1;
  --linen:      #F4EDE3;
  --sand:       #E7D8C3;
  --sand-deep:  #D6C2A8;
  --blush:      #E0AE9C;
  --blush-deep: #C98878;
  --peach:      #F2CDAE;
  --sage:       #9EAF95;
  --sage-deep:  #7C8F73;
  --sea:        #BFCFD2;
  --ink:        #4A3F36;
  --ink-soft:   #7A6C5D;
  --gold:       #C2A268;
  --white:      #FFFFFF;
  --shadow:     0 18px 50px -22px rgba(74, 63, 54, .45);
  --shadow-sm:  0 6px 20px -12px rgba(74, 63, 54, .5);
  --serif:      'Cormorant Garamond', 'Hoefler Text', Georgia, 'Times New Roman', serif;
  --sans:       'Jost', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

body::before {
  /* soft sand wash down the whole page */
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(1000px 500px at 15% -5%,  rgba(242, 205, 174, .30), transparent 60%),
    radial-gradient(900px 520px at 100% 12%, rgba(191, 207, 210, .30), transparent 60%),
    radial-gradient(800px 600px at 50% 105%, rgba(158, 175, 149, .22), transparent 62%);
  pointer-events: none;
  z-index: 0;
}

.page { position: relative; z-index: 1; }

/* ---- Type ----------------------------------------------------------------- */

h1, h2, h3 { font-family: var(--serif); font-weight: 300; margin: 0; letter-spacing: .01em; }

.script {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 300;
}

.eyebrow {
  font-family: var(--sans);
  font-size: .70rem;
  letter-spacing: .38em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin: 0;
}

/* ---- Hero ----------------------------------------------------------------- */

.hero {
  position: relative;
  text-align: center;
  padding-bottom: 2rem;
}

/* The photograph gets its own band, so nothing is ever printed over their
   faces. It dissolves into the cream page at the bottom edge. */
.hero__photo {
  position: relative;
  width: min(100%, 1180px);
  margin: 0 auto;
  /* the photograph's own proportions, so nothing important is cropped away */
  aspect-ratio: 1318 / 880;
  max-height: 66vh;
  min-height: 260px;
  background-image: var(--img-hero);
  background-size: cover;
  background-position: 50% 12%;
}
.hero__photo::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg,
      rgba(251, 247, 241, .30) 0%,
      rgba(251, 247, 241, .00) 26%,
      rgba(251, 247, 241, .00) 55%,
      rgba(251, 247, 241, .55) 82%,
      var(--cream) 100%),
    radial-gradient(120% 80% at 50% 40%, transparent 45%, rgba(139, 122, 105, .18) 100%);
}

.hero__inner {
  position: relative;
  max-width: 720px;
  margin: -2.9rem auto 0;
  padding: 0 1.5rem;
}

/* Monogram medallion, straddling the edge of the photograph */
.monogram {
  width: 5.4rem;
  height: 5.4rem;
  margin: 0 auto 1.5rem;
  border-radius: 50%;
  background: var(--cream);
  border: 1px solid var(--sand-deep);
  box-shadow: 0 0 0 6px var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 1.5rem;
  letter-spacing: .05em;
  color: var(--ink);
}

.hero__names {
  font-size: clamp(2.5rem, 8vw, 4.6rem);
  line-height: 1.06;
  color: var(--ink);
  margin: .9rem 0 .2rem;
}

.hero__names .amp {
  display: block;
  font-size: .40em;
  color: var(--blush-deep);
  margin: .1rem 0;
}

.hero__date {
  font-family: var(--sans);
  font-size: .78rem;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin: 1.2rem 0 0;
}

/* ornamental rule with a small diamond in the middle */
.rule {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .9rem;
  margin: 1.4rem auto;
  max-width: 320px;
  color: var(--sand-deep);
}
.rule::before, .rule::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--sand-deep), transparent);
}
.rule__mark { font-size: .6rem; color: var(--blush); letter-spacing: .3em; }

.countdown {
  margin-top: 1.6rem;
  font-family: var(--sans);
  font-size: .74rem;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.countdown strong {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.5rem;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  color: var(--blush-deep);
  display: block;
  margin-bottom: .1rem;
}

.scroll-cue {
  display: block;
  margin-top: 2rem;
  font-size: 1.3rem;
  line-height: 1;
  color: var(--sand-deep);
  text-decoration: none;
  animation: drift 2.6s ease-in-out infinite;
}
.scroll-cue:hover { color: var(--blush-deep); }
@keyframes drift {
  0%, 100% { transform: translateY(0);   opacity: .55; }
  50%      { transform: translateY(7px); opacity: 1; }
}

/* ---- Sections ------------------------------------------------------------- */

.section {
  max-width: 1040px;
  margin: 0 auto;
  padding: 4.5rem 1.5rem;
}

.section__title {
  text-align: center;
  font-size: clamp(1.9rem, 5vw, 2.8rem);
  color: var(--ink);
}

/* ---- Details: two cards + photo ------------------------------------------- */

.details {
  display: grid;
  grid-template-columns: 1fr .78fr;
  gap: 3.2rem;
  align-items: center;
  max-width: 940px;
  margin: 0 auto;
}

.cards { display: grid; gap: 1.4rem; }

.card {
  background: rgba(255, 255, 255, .72);
  border: 1px solid rgba(214, 194, 168, .55);
  border-radius: 3px;
  padding: 2rem 1.9rem;
  box-shadow: var(--shadow-sm);
  position: relative;
}
.card::after {
  content: '';
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(214, 194, 168, .40);
  border-radius: 2px;
  pointer-events: none;
}

.card__label {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.45rem;
  color: var(--blush-deep);
  margin-bottom: .5rem;
}
.card__venue {
  font-family: var(--serif);
  font-size: 1.32rem;
  line-height: 1.35;
  color: var(--ink);
}
.card__meta {
  font-size: .74rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: .7rem;
}

.photo-frame {
  position: relative;
  padding: 12px;
  background: var(--white);
  box-shadow: var(--shadow);
  transform: rotate(-1.2deg);
}
.photo-frame__img {
  display: block;
  width: 100%;
  aspect-ratio: 61 / 90;
  background-image: var(--img-beach);
  background-size: cover;
  background-position: center;
}
.photo-frame__caption {
  font-family: var(--serif);
  font-style: italic;
  text-align: center;
  color: var(--ink-soft);
  font-size: 1rem;
  padding: .7rem .3rem .2rem;
}

/* ---- RSVP form ------------------------------------------------------------ */

.rsvp { background: linear-gradient(180deg, transparent, rgba(244, 237, 227, .75) 18%, rgba(244, 237, 227, .75) 82%, transparent); }

.form-card {
  max-width: 700px;
  margin: 0 auto;
  background: var(--white);
  border-radius: 4px;
  box-shadow: var(--shadow);
  padding: 3rem clamp(1.4rem, 5vw, 3.2rem) 2.6rem;
  border-top: 3px solid var(--blush);
}

.form-intro { text-align: center; margin-bottom: 2.4rem; }
.form-intro p { color: var(--ink-soft); margin: .5rem 0 0; }

.deadline {
  display: inline-block;
  margin-top: 1rem;
  padding: .45rem 1.1rem;
  border: 1px solid var(--sand-deep);
  border-radius: 999px;
  font-size: .7rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  background: var(--linen);
}

.field { margin-bottom: 1.5rem; }

.field label,
.fieldset__legend {
  display: block;
  font-size: .70rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: .55rem;
  font-weight: 500;
}
.req { color: var(--blush-deep); }
.hint {
  display: block;
  text-transform: none;
  letter-spacing: 0;
  font-size: .82rem;
  color: var(--ink-soft);
  opacity: .85;
  margin-top: .3rem;
}

input[type="text"],
input[type="email"],
input[type="tel"],
select,
textarea {
  width: 100%;
  font-family: var(--sans);
  font-size: 1rem;
  color: var(--ink);
  background: var(--cream);
  border: 1px solid var(--sand);
  border-radius: 2px;
  padding: .8rem .95rem;
  transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
textarea { resize: vertical; min-height: 108px; line-height: 1.6; }

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--blush);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(224, 174, 156, .22);
}

.field--error input,
.field--error select,
.field--error textarea { border-color: #C4705C; background: #FDF4F1; }

.field__error {
  display: none;
  color: #B3543F;
  font-size: .82rem;
  margin-top: .4rem;
}
.field--error .field__error { display: block; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }

/* Attendance choice */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: stretch; }
.choice { position: relative; display: flex; }
.choice input {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}
.choice__box {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 108px;
  text-align: center;
  padding: 1.25rem 1rem;
  border: 1px solid var(--sand);
  border-radius: 3px;
  background: var(--cream);
  transition: all .2s ease;
  cursor: pointer;
}
.choice__box strong {
  display: block;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-weight: 400;
  line-height: 1.2;
  color: var(--ink);
  margin-bottom: .35rem;
}
.choice__box span {
  font-size: .74rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.choice input:focus-visible + .choice__box { box-shadow: 0 0 0 3px rgba(224, 174, 156, .3); }
.choice input:checked + .choice__box {
  border-color: var(--sage-deep);
  background: #EFF3EC;
  box-shadow: inset 0 0 0 1px var(--sage-deep);
}
.choice--no input:checked + .choice__box {
  border-color: var(--blush-deep);
  background: #FAF0EC;
  box-shadow: inset 0 0 0 1px var(--blush-deep);
}

.reveal {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height .45s ease, opacity .35s ease;
}
.reveal.is-open { max-height: 620px; opacity: 1; }

/* Button */
.btn {
  display: block;
  width: 100%;
  margin-top: 2rem;
  padding: 1.05rem 1.5rem;
  font-family: var(--sans);
  font-size: .78rem;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--white);
  background: var(--ink);
  border: none;
  border-radius: 2px;
  cursor: pointer;
  transition: background .2s ease, transform .12s ease, opacity .2s ease;
}
.btn:hover:not(:disabled) { background: var(--blush-deep); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.form-error {
  display: none;
  margin-top: 1.2rem;
  padding: .85rem 1rem;
  background: #FDF4F1;
  border-left: 3px solid #C4705C;
  color: #8E4432;
  font-size: .92rem;
}
.form-error.is-visible { display: block; }

/* ---- Thank you ------------------------------------------------------------ */

.thanks { display: none; text-align: center; padding: 1rem 0 .5rem; }
.thanks.is-visible { display: block; animation: rise .6s ease both; }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}

.thanks__mark {
  font-size: 2.4rem;
  color: var(--blush);
  margin-bottom: .6rem;
}
.thanks__title {
  font-size: clamp(1.9rem, 6vw, 2.6rem);
  color: var(--ink);
  margin-bottom: .6rem;
}
.thanks__body { color: var(--ink-soft); max-width: 460px; margin: 0 auto; }
.thanks__code {
  display: inline-block;
  margin-top: 1.6rem;
  padding: .7rem 1.4rem;
  background: var(--linen);
  border: 1px dashed var(--sand-deep);
  font-family: var(--sans);
  font-size: .78rem;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--ink);
}
.thanks__again {
  display: inline-block;
  margin-top: 1.8rem;
  background: none;
  border: none;
  border-bottom: 1px solid var(--sand-deep);
  padding: 0 0 .2rem;
  font-family: var(--sans);
  font-size: .74rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  cursor: pointer;
}
.thanks__again:hover { color: var(--blush-deep); border-color: var(--blush-deep); }

/* ---- Closed state --------------------------------------------------------- */

.closed { text-align: center; }
.closed h3 { font-size: 2rem; margin-bottom: .6rem; }
.closed p { color: var(--ink-soft); max-width: 440px; margin: 0 auto; }

/* ---- Footer --------------------------------------------------------------- */

.footer {
  text-align: center;
  padding: 3.5rem 1.5rem 4rem;
  color: var(--ink-soft);
}
.footer__names {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.5rem;
  color: var(--ink);
  margin-bottom: .4rem;
}
.footer__meta { font-size: .72rem; letter-spacing: .24em; text-transform: uppercase; }

/* ---- Responsive ----------------------------------------------------------- */

@media (min-width: 1220px) {
  /* Once the photo stops touching the edges, let it sit like a printed plate. */
  .hero__photo {
    margin-top: 2.2rem;
    box-shadow: 0 26px 70px -42px rgba(74, 63, 54, .6);
  }
}

@media (max-width: 820px) {
  .details { grid-template-columns: 1fr; gap: 2rem; }
  .photo-frame { transform: none; max-width: 420px; margin: 0 auto; }
  .grid-2 { grid-template-columns: 1fr; gap: 1.5rem; }
  /* On a phone the landscape photo is cropped square so the couple fills it. */
  .hero__photo { aspect-ratio: 1 / 1; max-height: 54vh; background-position: 50% 14%; }
  .section { padding: 3.2rem 1.25rem; }
  .form-card { padding: 2.2rem 1.4rem 2rem; }
}

@media (max-width: 420px) {
  .choices { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
